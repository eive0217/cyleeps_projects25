<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>채영 Portfolio</title>
  <style>
    *{box-sizing:border-box}html{background:#000;color:#fff;font-family:Arial,sans-serif;font-weight:700}body{margin:0}main{max-width:1600px;margin:auto;padding:64px 5vw 100px}section{margin:0 0 110px}section:last-child{margin-bottom:0}h1,h2{font-family:Arial,sans-serif;font-weight:700;font-size:clamp(2rem,5.3vw,5rem);letter-spacing:-.055em;line-height:1.05;margin:0 0 30px}img,video{display:block;width:100%;height:auto}video{background:#111;aspect-ratio:16/9;object-fit:contain}a{color:inherit}.sketch{max-width:1100px;margin:auto}.blender{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 24px}.pair{display:grid;gap:12px;align-content:start}.pair img{aspect-ratio:4/3;object-fit:contain;background:#fff}.pair img:first-child{background:#353535}video:focus-visible,a:focus-visible{outline:3px solid #1967d2;outline-offset:6px}@media(max-width:700px){main{padding:32px 20px 60px}section{margin-bottom:64px}h1,h2{margin-bottom:20px;letter-spacing:-.045em}.blender{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 12px}}@media(max-width:400px){.blender{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section aria-labelledby="infected">
    <h1 id="infected">INFECTED</h1>
    <video controls playsinline preload="none" poster="assets/image3.png" aria-label="INFECTED"><source src="assets/media2_compressed.mp4" type="video/mp4"></video>
  </section>
  <section aria-labelledby="sketch">
    <h2 id="sketch">Sketch to World</h2>
    <a href="assets/image2.png" target="_blank" rel="noopener" aria-label="Sketch to World"><img class="sketch" src="assets/image2.png" alt="Sketch to World" loading="lazy"></a>
  </section>
  <section aria-labelledby="monkey">
    <h2 id="monkey">Run Little Monkey</h2>
    <video controls playsinline preload="none" poster="assets/image1.png" aria-label="Run Little Monkey"><source src="assets/media1_compressed.mp4" type="video/mp4"></video>
  </section>
  <section aria-labelledby="blender">
    <h2 id="blender">Blender</h2>
    <div class="blender">
      <div class="pair"><img src="assets/image4.png" alt="Blender purple fruit model" loading="lazy"><img src="assets/image7.png" alt="Purple fruit reference" loading="lazy"></div>
      <div class="pair"><img src="assets/image5.png" alt="Blender white fruit model" loading="lazy"><img src="assets/image9.jpeg" alt="White fruit reference" loading="lazy"></div>
      <div class="pair"><img src="assets/image6.png" alt="Blender dark fruit model" loading="lazy"><img src="assets/image8.png" alt="Dark fruit reference" loading="lazy"></div>
      <div class="pair"><img src="assets/image10.png" alt="Blender pink fruit model" loading="lazy"><img src="assets/image11.png" alt="Pink fruit reference" loading="lazy"></div>
      <div class="pair"><img src="assets/image12.png" alt="Blender green fruit model" loading="lazy"><img src="assets/image13.png" alt="Green fruit reference" loading="lazy"></div>
      <div class="pair"><img src="assets/image14.png" alt="Blender cherry model" loading="lazy"><img src="assets/image15.png" alt="Cherry reference" loading="lazy"></div>
    </div>
  </section>
</main>
</body>
</html>
